# See this for info on calculating rotation distance from E steps.
# https://3dprintbeginner.com/rotation-distance-calculator/

# The definition for the primary extruder
[extruder]
step_pin: ar57
dir_pin: !ar58
enable_pin: !ar59
microsteps: 16
rotation_distance: 7.442
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ar11
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog15
pressure_advance = 0.1
min_temp: 0
max_temp: 260
max_extrude_only_distance: 200.0
# Valores PID iniciales — recalibrar con: PID_CALIBRATE HEATER=extruder TARGET=200
control: pid
pid_kp: 20.399
pid_ki: 0.901
pid_kd: 115.511

[extruder1]
step_pin: ar26
dir_pin: ar28
enable_pin: !ar24
microsteps: 16
rotation_distance: 7.442
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ar10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog13
pressure_advance = 0.1
min_temp: 0
max_temp: 260
max_extrude_only_distance: 200.0
# Valores PID iniciales — recalibrar con: PID_CALIBRATE HEATER=extruder1 TARGET=200
control: pid
pid_kp: 22.342
pid_ki: 1.192
pid_kd: 104.730
