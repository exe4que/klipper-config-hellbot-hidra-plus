# [safe_z_home] reemplazado por [homing_override] para control explícito IDEX.
# Con safe_z_home, Klipper movía T0 al centro (100,100) durante el home de Z,
# lo que parecía un "modo espejo". homing_override evita ese comportamiento.

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    {% set do_x = 'X' in params or (not 'X' in params and not 'Y' in params and not 'Z' in params) %}
    {% set do_y = 'Y' in params or (not 'X' in params and not 'Y' in params and not 'Z' in params) %}
    {% set do_z = 'Z' in params or (not 'X' in params and not 'Y' in params and not 'Z' in params) %}

    # Levantar Z para evitar choques (set_position_z:0 en cabecera le dice a Klipper
    # que Z está en 0, así G0 Z10 siempre mueve hacia arriba sin importar la posición real)
    G90
    G0 Z10 F600

    {% if do_x %}
        # Home T0 (carro izquierdo) → mueve hasta activar endstop izquierdo
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
        G28 X

        # Home T1 (carro derecho) → mueve hasta activar endstop derecho
        SET_DUAL_CARRIAGE CARRIAGE=1
        G28 X
        # T1 queda en su endstop (X=359.35), suficientemente lejos de T0 (max X=300)

        # Restaurar T0 como carro activo
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
    {% endif %}

    {% if do_y %}
        G28 Y
    {% endif %}

    {% if do_z %}
        G28 Z
    {% endif %}

