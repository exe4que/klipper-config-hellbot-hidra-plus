[gcode_macro END_PRINT]
gcode:
    M117 End printing.
	RESPOND MSG="End printing"
    G91 ; relative positioning
    G1 E-1 F300 ;retract the filament a bit before lifting the nozzle to release some of the pressure
    G1 Z+5 E-2 F1000 ;move Z up a bit and extract a bit more
#   T1
#	T0
#    G90 ; absolute positioning
# 	G0 Y220 F6000 ; make the printed object accessible
    m104 S0 T0 ; turn hotend heating off
    m104 S0 T1 ; turn hotend heating off
	M140 S0 ; turn hotbed heating off
	G90
	T0
	SET_DUAL_CARRIAGE CARRIAGE=0
	G0 X70 Y140 F5000
	SET_DUAL_CARRIAGE CARRIAGE=1
	G0 X170 F5000
    M106 S255 ; turn fan on for cooling
    M84 ; steppers off
	clear_stepper_x_range
	G4 P300000 ;keep fans on for 5 minutes
    M106 S0 ; turn fan off



[gcode_macro SEARCH_VARS]
gcode:
    {% set search = params.S|lower %}
    {% set ns = namespace() %}
    {% for item in printer  %}
        {% if ' ' in item %}
            {% set ns.path = ['printer', "['%s']" % (item), ''] %}
        {% else %}
            {% set ns.path = ['printer.', item, ''] %}   
        {% endif %} 

        {% if search in ns.path|lower %}
            { action_respond_info(ns.path|join) }
        {% endif %} 

        {% if printer[item].items() %}
            {% for childkey, child in printer[item].items() recursive %}
                {% set ns.path = ns.path[:loop.depth|int + 1] %}

                {% if ' ' in childkey %}
                    {% set null = ns.path.append("['%s']" % (childkey)) %}
                {% else %}
                    {% set null = ns.path.append(".%s" % (childkey)) %}
                {% endif %} 

                {% if child is mapping  %}
                    { loop(child.items()) }
                {% else %}
                    {% if search in ns.path|lower %}
                        { action_respond_info("%s : %s" % (ns.path|join, child)) }   
                    {% endif %} 
                {% endif %} 
                
            {% endfor %}
        {% endif %} 
    {% endfor %}

    


# ─── Nivelación manual de cama por esquinas ───────────────────────────────────
# Uso: ejecutar NIVEL_CAMA repetidamente para recorrer las 4 esquinas.
# En cada esquina ajustar el tornillo nivelador con el método de la hoja de papel.
# Al completar las 4 esquinas vuelve al inicio automáticamente.
# Nota: activa T0 directamente (sin macro T0) para evitar offsets de gcode que
#        desplazan X. Re-homea T1 antes de esquinas derechas para evitar colisión.
[gcode_macro NIVEL_CAMA]
variable_esquina: 0
gcode:
    # Posiciones de tornillos niveladores. Y=10 = frente, Y=290 = atrás.
    {% set x_izq   = 35  %}
    {% set x_der   = 275 %}
    {% set y_frente = 35  %}
    {% set y_atras  = 275 %}
    # Coordenadas tomadas de [bed_screws] en printer.cfg
    {% set esquinas = [
        {'x': x_izq, 'y': y_frente, 'nombre': 'Frente-Izquierda — screw1 (35,35)'},
        {'x': x_der, 'y': y_frente, 'nombre': 'Frente-Derecha   — screw4 (275,35)'},
        {'x': x_der, 'y': y_atras,  'nombre': 'Atras-Derecha    — screw3 (275,275)'},
        {'x': x_izq, 'y': y_atras,  'nombre': 'Atras-Izquierda  — screw2 (35,275)'},
    ] %}
    {% if esquina == 0 %}
        {% if not ("x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes) %}
            RESPOND MSG="Homeando todos los ejes..."
            G28
        {% endif %}
        # Activar T0 sin llamar la macro T0 para evitar que set_stepper_x_range
        # aplique un gcode offset que desplace todas las coordenadas X.
        RESPOND MSG="Activando T0..."
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
        SET_GCODE_OFFSET X=0 Y=0
        G90
        G0 Z5 F600
    {% endif %}
    {% set c = esquinas[esquina] %}
    G0 Z5 F600
    G0 X{c.x} Y{c.y} F3000
    G0 Z0 F500
    RESPOND MSG="=== Esquina {esquina + 1}/4: {c.nombre} — X={c.x} Y={c.y} ==="
    RESPOND MSG="Desliza el papel y ajusta el tornillo. Ejecuta NIVEL_CAMA para continuar."
    SET_GCODE_VARIABLE MACRO=NIVEL_CAMA VARIABLE=esquina VALUE={(esquina + 1) % 4}


# ─── Carga / descarga de filamento ────────────────────────────────────────────
# Uso: LOAD_FILAMENT  [TEMP=200]
#      UNLOAD_FILAMENT [TEMP=200]
# Actúan sobre el extrusor activo en ese momento (T0 o T1).
# Si la temperatura actual es menor al objetivo, calientan primero.

[gcode_macro LOAD_FILAMENT]
description: Extruye 150 mm de filamento a 300 mm/min. Parámetro opcional TEMP (default 200).
gcode:
    {% set temp = params.TEMP|default(200)|int %}
    {% set active_extruder = printer.toolhead.extruder %}
    {% set current_temp = printer[active_extruder].temperature|int %}
    RESPOND MSG="Cargando filamento en {active_extruder} — objetivo {temp}°C"
    {% if current_temp < temp %}
        RESPOND MSG="Calentando a {temp}°C..."
        M109 S{temp}
    {% endif %}
    SAVE_GCODE_STATE NAME=load_filament
    M83                 ; extrusión relativa
    G1 E150 F300        ; 150 mm a 300 mm/min (5 mm/s)
    G92 E0
    RESTORE_GCODE_STATE NAME=load_filament
    RESPOND MSG="Filamento cargado."

[gcode_macro UNLOAD_FILAMENT]
description: Purga 30 mm a 300 mm/min y luego retrae 150 mm a 1800 mm/min. Parámetro opcional TEMP (default 200).
gcode:
    {% set temp = params.TEMP|default(200)|int %}
    {% set active_extruder = printer.toolhead.extruder %}
    {% set current_temp = printer[active_extruder].temperature|int %}
    RESPOND MSG="Descargando filamento en {active_extruder} — objetivo {temp}°C"
    {% if current_temp < temp %}
        RESPOND MSG="Calentando a {temp}°C..."
        M109 S{temp}
    {% endif %}
    SAVE_GCODE_STATE NAME=unload_filament
    M83                 ; extrusión relativa
    G1 E30 F300         ; purga 30 mm a 300 mm/min — forma el tip y limpia el nozzle
    G1 E-150 F1800      ; retrae 150 mm a 1800 mm/min (30 mm/s) — extracción rápida anti-tapón
    G92 E0
    RESTORE_GCODE_STATE NAME=unload_filament
    RESPOND MSG="Filamento descargado."
